# Publishes the Vite gallery to GitHub Pages on every push to main.
#
# Requires Pages enabled for the repository with "Source: GitHub Actions"
# (Settings → Pages).
name: Deploy gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # A project Pages site is served from /<repo>/, not /. vite.config.ts
      # reads GALLERY_BASE, and src/gallery/main.tsx uses the same base to
      # remap Remotion's staticFile() paths.
      - run: npm run build:gallery
        env:
          GALLERY_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-gallery

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
